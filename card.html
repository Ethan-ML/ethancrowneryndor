<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Card personal de Ethan Crown con enlaces a redes sociales."
    >

    <title>Ethan Crown | Card</title>
    <link rel="icon" type="image/png" href="img/elogo.png">

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/cursor.css">

</head>

<body>

<header>
<div class="navbar">
<div class="logo">
<img src="img/logo/logo.png">
</div>

<nav>
<a href="index.html">HOME</a>
<a href="map.html">WORLD</a>
<a href="characters.html">CHARACTERS</a>
</nav>
</div>
</header>

<div class="music-btn">
    <img src="img/logo/lmusic.png" id="musicIcon" alt="Music">
    <audio id="bgMusic" loop>
        <source src="music/home.mp3" type="audio/mpeg">
    </audio>
</div>

    <main class="page-container">

        <article class="profile-card">

            <!-- Fondo oscuro interior de la tarjeta -->
            <div class="card-background"></div>

            <!-- Fotografía colocada detrás del círculo del marco -->
            <div class="profile-picture-container">

                <img
                    src="img/kass.png"
                    alt="Foto de perfil de Ethan Crown"
                    class="profile-picture"
                >

            </div>

            <!-- Contenido -->
            <div class="card-content">

                <div class="profile-header1">

                    <span class="small-crown">♛</span>

                    <h1>Ethan Crown</h1>

                    <div class="title-decoration">
                        <span></span>
                        <i>✦</i>
                        <span></span>
                    </div>

                    <p class="profile-description">
                        Artista, creador de bots y soñador de mundos
                        fantásticos. Aquí encontrarás mis redes,
                        proyectos y formas de apoyar mi trabajo.
                    </p>

                </div>

                <section class="links-section">

                    <div class="section-title">
                        <span></span>
                        <i>✦</i>

                        <h2>Links</h2>

                        <i>✦</i>
                        <span></span>
                    </div>

                    <nav class="social-links" aria-label="Enlaces sociales">

                        <!-- JanitorAI -->
                        <a
                            href="https://janitorai.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="social-button"
                        >
                            <span class="social-icon janitor-icon">
                                J
                            </span>

                            <span class="social-name">
                                JanitorAI
                            </span>

                            <span class="social-star">
                                ✦
                            </span>
                        </a>

                        <!-- Eryndor -->

 <a href="https://ethan-ml.github.io/ethan-crown-eryndor/index.html" target="_blank" rel="noopener noreferrer" class="social-button">
<span class="social-icon eryndor-icon">
        <img src="img/elogo.png" alt="Logo de Eryndor">
    </span>

    <span class="social-name">
        Eryndor
    </span>

    <span class="social-star">
        ✦
    </span>
</a>

                        <!-- Ko-fi -->
                        <a
                            href="https://ko-fi.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="social-button"
                        >
                            <span class="social-icon kofi-icon">
                                <i class="fa-solid fa-mug-hot"></i>
                            </span>

                            <span class="social-name">
                                Ko-fi
                            </span>

                            <span class="social-star">
                                ✦
                            </span>
                        </a>

                        <!-- Instagram -->
                        <a
                            href="https://instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="social-button"
                        >
                            <span class="social-icon instagram-icon">
                                <i class="fa-brands fa-instagram"></i>
                            </span>

                            <span class="social-name">
                                Instagram
                            </span>

                            <span class="social-star">
                                ✦
                            </span>
                        </a>

                        <!-- TikTok -->
                        <a
                            href="https://tiktok.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="social-button"
                        >
                            <span class="social-icon tiktok-icon">
                                <i class="fa-brands fa-tiktok"></i>
                            </span>

                            <span class="social-name">
                                TikTok
                            </span>

                            <span class="social-star">
                                ✦
                            </span>
                        </a>

                        <!-- YouTube -->
                        <a
                            href="https://youtube.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="social-button"
                        >
                            <span class="social-icon youtube-icon">
                                <i class="fa-brands fa-youtube"></i>
                            </span>

                            <span class="social-name">
                                YouTube
                            </span>

                            <span class="social-star">
                                ✦
                            </span>
                        </a>

                    </nav>

                </section>

            </div>

            <!--
                El marco debe ir al final para quedar por encima
                de la foto, los textos y los botones.
            -->
            <img
                src="img/marco.png"
                alt=""
                class="metal-frame"
                aria-hidden="true"
            >
        </article>
    </main>

    <script src="js/music.js"></script>
    <!-- CUSTOM CURSOR -->
<div id="custom-cursor"></div>

<script src="js/cursor.js"></script>

</body>
</html>
